<!DOCTYPE html>
<html lang="en">
<head>
  <title>Maptime AMS #4: Geopolitics, Borders &amp; D3.js!</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    svg {
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <svg>
    <g id="states"></g>
  </svg>
  <h1>United States in <span id="year">1790</span></h1>
  <script>
    var svgStates = d3.select("svg #states");

    var width = window.innerWidth,
        height = window.innerHeight;

    var projection = d3.geoAlbersUsa()
        .translate([width / 2, height / 2]);

    var path = d3.geoPath()
        .projection(projection);

    d3.json("../../data/states.json").then(function(topologies) {

      var state = topojson.feature(topologies[0], topologies[0].objects.stdin);

      svgStates.selectAll("path")
          .data(state.features)
          .enter()
        .append("path")
          .attr("d", path);
    });
  </script>
</body>
</html>
